<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Create an account | PollPulse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="page-shell">
    <section class="card auth-card register-card">
        <a class="brand" th:href="@{/}">PollPulse</a>
        <h1>Create an account</h1>
        <p class="muted">Register to take part in your campus elections.</p>

        <div id="form-error" class="alert alert-error" role="alert" hidden></div>
        <form id="register-form">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" minlength="2" maxlength="100" autocomplete="name" required>
            <p class="field-error" data-error-for="name"></p>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <p class="field-error" data-error-for="email"></p>

            <label for="department">Department <span class="optional">(optional)</span></label>
            <input id="department" name="department" type="text">

            <label for="batch">Batch <span class="optional">(optional)</span></label>
            <input id="batch" name="batch" type="text">

            <label for="hall">Hall <span class="optional">(optional)</span></label>
            <input id="hall" name="hall" type="text">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <p class="field-error" data-error-for="password"></p>

            <button class="button button-full" type="submit">Create account</button>
        </form>
        <p class="auth-footer">Already registered? <a th:href="@{/login}">Login</a></p>
    </section>
</main>
<script>
    const form = document.getElementById("register-form");
    const formError = document.getElementById("form-error");
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    function clearErrors() {
        formError.textContent = "";
        formError.hidden = true;
        document.querySelectorAll("[data-error-for]").forEach((element) => {
            element.textContent = "";
        });
    }

    function showFormError(message) {
        formError.textContent = message;
        formError.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearErrors();

        const values = Object.fromEntries(new FormData(form).entries());
        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(values)
            });
            const result = await response.json();

            if (response.status === 201) {
                window.location.assign("/login?registered");
                return;
            }
            if (response.status === 400 && result.fieldErrors) {
                Object.entries(result.fieldErrors).forEach(([field, message]) => {
                    const target = Array.from(document.querySelectorAll("[data-error-for]"))
                        .find((element) => element.dataset.errorFor === field);
                    if (target) {
                        target.textContent = message;
                    }
                });
                return;
            }
            showFormError(result.message || "Registration could not be completed.");
        } catch {
            showFormError("Registration could not be completed. Please try again.");
        }
    });
</script>
</body>
</html>
